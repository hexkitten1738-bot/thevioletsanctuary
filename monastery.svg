  <path d="M760 610 H840 L980 900 H620 Z" fill="#B8A898" opacity="0.8"/>
  <circle cx="800" cy="740" r="70" fill="#5C7656"/>
  <circle cx="800" cy="740" r="22" fill="#8E7B70"/>
  <path d="M800 690 V790 M760 740 H840" stroke="#D0AB75" stroke-width="5"/>
  <g fill="#2F3F2E"><circle cx="160" cy="760" r="70"/><circle cx="1450" cy="760" r="80"/><circle cx="90" cy="700" r="50"/></g>
  <g fill="#B8A4D1"><circle cx="140" cy="730" r="6"/><circle cx="180" cy="760" r="6"/><circle cx="1430" cy="730" r="6"/><circle cx="1480" cy="770" r="6"/></g>
  <g fill="#F7E6A8" opacity="0.8"><circle cx="300" cy="680" r="2.5"/><circle cx="560" cy="700" r="2"/><circle cx="1000" cy="660" r="2.5"/><circle cx="1260" cy="700" r="2"/></g>
  </g>
  <use href="#scene" filter="url(#bloom)" opacity="0.55" style="mix-blend-mode:screen"/>
  <g></g>
  <rect width="1600" height="900" fill="url(#grade)" opacity="0.22" style="mix-blend-mode:soft-light"/>
