  <rect x="70" y="222" width="186" height="196" fill="#D9C9A8"/>
  <g fill="none" stroke="#8A6F5C" stroke-width="3"><path d="M90 400 C120 340 160 330 160 280 C160 250 200 240 230 260"/><path d="M160 330 C190 340 220 360 238 390"/></g>
