    <g fill="#B8A4D1"><circle cx="1290" cy="516" r="7"/><circle cx="1259" cy="527" r="6"/><circle cx="1321" cy="530" r="6"/></g>
  </g>

  <!-- floor -->
  <path d="M0 640 H1600 V900 H0 Z" fill="url(#floor)"/>
  <g stroke="#3A2A34" stroke-width="2" opacity="0.7">
    <path d="M0 700 H1600 M0 780 H1600 M0 870 H1600"/>
    <path d="M200 640 L120 900 M500 640 L460 900 M800 640 V900 M1100 640 L1140 900 M1400 640 L1480 900"/>
  </g>
  <ellipse cx="800" cy="800" rx="460" ry="70" fill="#5A3E86" opacity="0.8"/>
  <ellipse cx="800" cy="800" rx="420" ry="56" fill="none" stroke="#D0AB75" stroke-width="3" opacity="0.6"/>

  <!-- welcome desk -->
