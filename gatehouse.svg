  <path d="M560 580 Q800 540 1040 580 V720 Q800 690 560 720 Z" fill="url(#wood)"/>
  <path d="M560 580 Q800 540 1040 580" fill="none" stroke="#B88A5E" stroke-width="8"/>
  <g stroke="#2A1C14" stroke-width="3" fill="none" opacity="0.7">
    <path d="M640 590 V705"/><path d="M720 580 V695"/><path d="M880 580 V695"/><path d="M960 590 V705"/>
  </g>
  <!-- guest book -->
  <path d="M740 556 L800 548 L860 556 L858 572 L800 566 L742 572 Z" fill="#EEE4D7"/>
  <path d="M800 548 V566" stroke="#B8A4D1" stroke-width="2"/>
  <!-- pamphlets -->
  <g><rect x="604" y="552" width="56" height="12" fill="#B8A4D1" transform="rotate(-4 632 558)"/><rect x="606" y="542" width="54" height="12" fill="#EEE4D7" transform="rotate(3 633 548)"/><rect x="610" y="534" width="50" height="10" fill="#D9C4F0"/></g>
  <!-- candle and bell -->
  <rect x="972" y="520" width="14" height="40" fill="#F1E6C8"/>
  <path d="M979 518 C972 506 974 498 979 488 C984 498 986 506 979 518 Z" fill="#FFE2A8"/>
  <circle cx="979" cy="505" r="40" fill="#FFE2A8" opacity="0.35" filter="url(#blur)"/>
  <path d="M900 562 Q910 538 920 562 Z" fill="#D0AB75"/>

  <!-- lantern body (front) -->
  <path d="M780 40 H820 L828 100 H772 Z" fill="#2A2135" stroke="#D0AB75" stroke-width="2"/>
  <circle cx="800" cy="72" r="10" fill="#FFE2A8"/>

  <!-- fireflies / dust motes -->
  <g fill="#F7E6A8" opacity="0.8">
    <circle cx="420" cy="380" r="2.5"/><circle cx="560" cy="420" r="2"/><circle cx="700" cy="300" r="2"/><circle cx="910" cy="360" r="2.5"/><circle cx="1180" cy="300" r="2"/><circle cx="1310" cy="520" r="2"/>
  </g>
  </g>
  <use href="#scene" filter="url(#bloom)" opacity="0.55" style="mix-blend-mode:screen"/>
  <g><path d="M440 180 L520 180 L690.0 900 L270.0 900 Z" fill="url(#ray)" opacity="0.32" style="mix-blend-mode:screen"/><path d="M760 40 L840 40 L990.0 900 L610.0 900 Z" fill="url(#ray)" opacity="0.32" style="mix-blend-mode:screen"/></g>
  <rect width="1600" height="900" fill="url(#grade)" opacity="0.22" style="mix-blend-mode:soft-light"/>
  <g><circle cx="560" cy="261" r="8.5" fill="#E9F09A" opacity="0.35" filter="url(#fly)"/><circle cx="560" cy="261" r="2.6" fill="#FBFFD8"/><circle cx="219" cy="469" r="7.0" fill="#E9F09A" opacity="0.35" filter="url(#fly)"/><circle cx="219" cy="469" r="2.2" fill="#FBFFD8"/><circle cx="199" cy="454" r="5.3" fill="#E9F09A" opacity="0.35" filter="url(#fly)"/><circle cx="199" cy="454" r="1.7" fill="#FBFFD8"/><circle cx="710" cy="218" r="5.6" fill="#E9F09A" opacity="0.35" filter="url(#fly)"/><circle cx="710" cy="218" r="1.7" fill="#FBFFD8"/><circle cx="697" cy="627" r="5.8" fill="#E9F09A" opacity="0.35" filter="url(#fly)"/><circle cx="697" cy="627" r="1.8" fill="#FBFFD8"/><circle cx="424" cy="519" r="10.0" fill="#E9F09A" opacity="0.35" filter="url(#fly)"/><circle cx="424" cy="519" r="3.1" fill="#FBFFD8"/><circle cx="905" cy="394" r="10.1" fill="#E9F09A" opacity="0.35" filter="url(#fly)"/><circle cx="905" cy="394" r="3.2" fill="#FBFFD8"/><circle cx="183" cy="644" r="6.6" fill="#E9F09A" opacity="0.35" filter="url(#fly)"/><circle cx="183" cy="644" r="2.1" fill="#FBFFD8"/><circle cx="316" cy="244" r="6.7" fill="#E9F09A" opacity="0.35" filter="url(#fly)"/><circle cx="316" cy="244" r="2.1" fill="#FBFFD8"/><circle cx="1230" cy="278" r="8.1" fill="#E9F09A" opacity="0.35" filter="url(#fly)"/><circle cx="1230" cy="278" r="2.5" fill="#FBFFD8"/><circle cx="989" cy="381" r="7.9" fill="#E9F09A" opacity="0.35" filter="url(#fly)"/><circle cx="989" cy="381" r="2.5" fill="#FBFFD8"/><circle cx="205" cy="212" r="6.2" fill="#E9F09A" opacity="0.35" filter="url(#fly)"/><circle cx="205" cy="212" r="1.9" fill="#FBFFD8"/><circle cx="1045" cy="411" r="6.7" fill="#E9F09A" opacity="0.35" filter="url(#fly)"/><circle cx="1045" cy="411" r="2.1" fill="#FBFFD8"/><circle cx="916" cy="425" r="6.7" fill="#E9F09A" opacity="0.35" filter="url(#fly)"/><circle cx="916" cy="425" r="2.1" fill="#FBFFD8"/><circle cx="1200" cy="557" r="6.4" fill="#E9F09A" opacity="0.35" filter="url(#fly)"/><circle cx="1200" cy="557" r="2.0" fill="#FBFFD8"/><circle cx="901" cy="464" r="9.6" fill="#E9F09A" opacity="0.35" filter="url(#fly)"/><circle cx="901" cy="464" r="3.0" fill="#FBFFD8"/><circle cx="1112" cy="335" r="10.1" fill="#E9F09A" opacity="0.35" filter="url(#fly)"/><circle cx="1112" cy="335" r="3.2" fill="#FBFFD8"/><circle cx="281" cy="406" r="9.0" fill="#E9F09A" opacity="0.35" filter="url(#fly)"/><circle cx="281" cy="406" r="2.8" fill="#FBFFD8"/><circle cx="327" cy="444" r="5.3" fill="#E9F09A" opacity="0.35" filter="url(#fly)"/><circle cx="327" cy="444" r="1.7" fill="#FBFFD8"/><circle cx="1029" cy="593" r="8.1" fill="#E9F09A" opacity="0.35" filter="url(#fly)"/><circle cx="1029" cy="593" r="2.5" fill="#FBFFD8"/></g>
  <rect width="1600" height="900" fill="url(#vig)"/>
  <rect width="1600" height="900" filter="url(#paper)"/>
</svg>
