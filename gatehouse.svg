    <g stroke="#3E5A3E" stroke-width="5" stroke-linecap="round"><path d="M310 580 V520"/><path d="M300 584 L280 530"/><path d="M320 584 L340 534"/></g>
    <g fill="#B8A4D1"><circle cx="310" cy="516" r="7"/><circle cx="279" cy="527" r="6"/><circle cx="341" cy="530" r="6"/><circle cx="310" cy="535" r="5"/></g>
    <path d="M1256 640 L1270 580 H1310 L1324 640 Z" fill="#6B4E86"/>
