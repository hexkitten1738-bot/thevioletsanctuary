    <linearGradient id="grade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B07AD8"/><stop offset="0.55" stop-color="#5A3C8C"/><stop offset="1" stop-color="#F0A86A"/></linearGradient>
    <radialGradient id="ray" cx="0.5" cy="0" r="1"><stop offset="0" stop-color="#FFF2CF" stop-opacity="0.55"/><stop offset="1" stop-color="#FFF2CF" stop-opacity="0"/></radialGradient>
