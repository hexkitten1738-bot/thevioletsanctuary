<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- PLACEHOLDER ART: The Approach. Replace with a painted scene (1600x900, 16:9). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16112A"/>
      <stop offset="0.38" stop-color="#2E2246"/>
